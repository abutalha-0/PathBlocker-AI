{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PathBlocker AI</title>
    <link rel="stylesheet" href="{% static 'game/css/board.css' %}">
</head>
<body>
    <div id="menu">
        <h1>PathBlocker AI</h1>
        <div class="menu-row">
            <label><input type="radio" name="mode" value="ai" checked> Player vs AI</label>
            <label><input type="radio" name="mode" value="2p"> 2 Player</label>
        </div>
        <div class="menu-row" id="difficulty-row">
            <label for="difficulty">Difficulty</label>
            <select id="difficulty">
                <option value="easy">Easy</option>
                <option value="medium" selected>Medium</option>
                <option value="hard">Hard</option>
            </select>
        </div>
        <button id="start-game" type="button">Start Game</button>
    </div>
    <div id="app" hidden>
        <div id="hud">
            <div class="hud-player" data-player="0">Player 1 — <span id="walls-0"></span> walls</div>
            <div id="turn-indicator"></div>
            <div class="hud-player" data-player="1">Player 2 — <span id="walls-1"></span> walls</div>
            <button id="back-to-menu" type="button">Menu</button>
        </div>
        <div id="board-wrap">
            <canvas id="board"></canvas>
            <div id="game-over" hidden>
                <p id="game-over-message"></p>
                <button id="play-again" type="button">Play Again</button>
            </div>
        </div>
    </div>
    {{ state|json_script:"game-state" }}
    <form id="csrf-form">{% csrf_token %}</form>
    <script src="{% static 'game/js/board.js' %}"></script>
</body>
</html>
